appId: app.cyberhorse.desktop
productName: Cyber Horse
directories:
  output: release
files:
  - out/**/*
  - package.json
  - config/default-settings.json
  - assets/**/*
asar: true
extraResources:
  - from: out/native
    to: vlc-host
    filter: [vlc-host.exe]
afterPack: scripts/verify-packaged-assets.cjs
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Cyber Horse
portable:
  artifactName: Cyber-Horse-${version}-${arch}-portable.${ext}
artifactName: Cyber-Horse-${version}-${arch}.${ext}
